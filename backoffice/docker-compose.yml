# PixelJoy catalog + back-office. Usage: see README.md (cp .env.example .env, then docker compose up -d).
# Behind the shared Traefik of infra/edge: add -f docker-compose.traefik.yml; behind an existing Nginx
# instead of Caddy: add -f docker-compose.nginx.yml (README.md).
name: pixeljoy-catalog

services:
  app:
    build:
      context: ..
      dockerfile: backoffice/Dockerfile
    image: pixeljoy-backoffice:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_URL: https://${DOMAIN}
      # Not mandatory here so `docker compose run app node dist/hash-password.mjs` works before
      # .env is complete; the server itself refuses to start without a valid hash and secret.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUST_PROXY: "true"
    volumes:
      - catalog-data:/data
    # Not published on the host: only Caddy (or Traefik, through the "edge" network of
    # docker-compose.traefik.yml) can reach it. In "nginx" proxy mode,
    # docker-compose.nginx.yml publishes it on 127.0.0.1:${APP_PORT} only and disables Caddy.
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    # Pinned by digest (updated by Dependabot, see README.md).
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  catalog-data:
  caddy-data:
  caddy-config:
