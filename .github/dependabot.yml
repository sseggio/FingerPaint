# Keeps the back-office base images (pinned by digest), its npm dependencies and the GitHub Actions
# (pinned by commit SHA) up to date.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backoffice
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backoffice
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backoffice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # GitHub Actions are pinned by commit SHA (tag in a comment): Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
