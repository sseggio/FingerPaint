# Keeps the back-office base images (pinned by digest) and its npm dependencies up to date.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backoffice
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backoffice
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backoffice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
