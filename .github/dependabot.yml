# Keeps the back-office and infra/edge images (pinned by digest), the back-office npm dependencies
# and the GitHub Actions (pinned by commit SHA) up to date.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backoffice
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backoffice
    schedule:
      interval: weekly
  # Shared reverse proxy of the VPS (Traefik + docker-socket-proxy, pinned by digest).
  - package-ecosystem: docker-compose
    directory: /infra/edge
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backoffice
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # GitHub Actions are pinned by commit SHA (tag in a comment): Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
