# Manual deployment of the catalog back-office to the VPS over SSH (see backoffice/README.md).
# Required repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY. Recommended: VPS_KNOWN_HOSTS
# (output of `ssh-keyscan <host>`); without it the host key is fetched at deploy time.
name: Backoffice deploy
on:
  workflow_dispatch:
    inputs:
      path:
        description: Repository path on the VPS
        required: true
        default: ~/pixeljoy
permissions:
  contents: read
concurrency:
  group: backoffice-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
      - name: Pull, rebuild and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ inputs.path }}
        run: |
          case "$DEPLOY_PATH" in
            *[!A-Za-z0-9._/~-]*) echo "invalid path"; exit 1 ;;
          esac
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -e; cd $DEPLOY_PATH && git pull --ff-only && cd backoffice && docker compose up -d --build && docker image prune -f && docker compose ps"
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
