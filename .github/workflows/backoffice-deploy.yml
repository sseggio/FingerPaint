# Fully automated deployment of the catalog back-office to the VPS (see backoffice/README.md,
# « Déploiement automatique depuis GitHub »). Manual trigger only (Actions tab or workflow_dispatch API).
#
# The VPS never needs access to GitHub: the runner builds an archive of exactly what
# backoffice/Dockerfile copies (backoffice/scripts/build-deploy-archive.sh), streams it over SSH into
# <path>/releases/<sha>, then backoffice/scripts/deploy-remote.sh (run on the VPS) checks Docker,
# creates <path>/shared/.env on the first run, builds, switches the <path>/current symlink and runs
# `docker compose up -d --build` (fixed project name: the data volumes persist across releases).
#
# Proxy modes (input `proxy`):
#   nginx (default)  the VPS already runs Nginx on 80/443 for other sites. The deployment never
#                    touches Nginx nor /etc (the SSH user has no sudo): no Caddy container, the app
#                    listens on 127.0.0.1:<app_port> only, and root configures Nginx once with
#                    backoffice/deploy/nginx/admin.pixeljoy.conf.example (README, « Derrière un
#                    Nginx existant »). Success = the manifest answers on 127.0.0.1:<app_port> on
#                    the VPS; the public HTTPS check is only a warning (Nginx may not be set up yet).
#   caddy            the bundled Caddy owns 80/443 and gets the certificate; success = the public
#                    https://<domain>/catalog/v1/manifest.json and /admin answer.
#
# Required secrets (Settings > Secrets and variables > Actions; repository secrets, or secrets of the
# GitHub environment chosen with the `environment` input, "Staging" by default):
#   VPS_HOST                   IP or host name of the VPS (e.g. 151.80.155.198)
#   VPS_USER                   SSH user on the VPS, member of the docker group (e.g. deploy)
#   VPS_SSH_KEY                private key dedicated to deployments (its public key is in
#                              ~VPS_USER/.ssh/authorized_keys on the VPS)
#   VPS_KNOWN_HOSTS            the VPS host key line(s), checked strictly: never fetched at deploy time
#   BACKOFFICE_ADMIN_PASSWORD  admin password (12+ characters). Only its scrypt hash leaves the
#                              runner, and only on the first deployment or with rotate_password.
name: Backoffice deploy
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain of the back-office (DNS A record pointing to the VPS)
        required: true
        default: admin.pixeljoy.krafting.be
      path:
        description: Deployment folder on the VPS (relative to the SSH user's home, or absolute)
        required: true
        default: ~/pixeljoy
      environment:
        description: GitHub environment holding the deployment secrets
        type: choice
        options:
          - Staging
          - production
        default: Staging
      proxy:
        description: "Reverse proxy: nginx = the VPS's existing Nginx proxies to 127.0.0.1:<app_port> (no Caddy); caddy = bundled Caddy on 80/443"
        type: choice
        options:
          - nginx
          - caddy
        default: nginx
      app_port:
        description: "nginx mode: loopback port of the app (empty = repository variable APP_PORT, else 8787)"
        required: false
        default: ""
      rotate_password:
        description: Replace ADMIN_PASSWORD_HASH on the VPS with the hash of BACKOFFICE_ADMIN_PASSWORD
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backoffice-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Created automatically by GitHub on the first run. Optional hardening (README, section 3.5):
    # restrict it to the integration branch and move the secrets into it. No required reviewers,
    # so the deployment stays triggerable through the workflow_dispatch API.
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate inputs and secrets
        env:
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_PATH: ${{ inputs.path }}
          INPUT_ROTATE: ${{ inputs.rotate_password }}
          INPUT_PROXY: ${{ inputs.proxy }}
          INPUT_APP_PORT: ${{ inputs.app_port }}
          VAR_APP_PORT: ${{ vars.APP_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BACKOFFICE_ADMIN_PASSWORD: ${{ secrets.BACKOFFICE_ADMIN_PASSWORD }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS BACKOFFICE_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          if [ "${#BACKOFFICE_ADMIN_PASSWORD}" -lt 12 ]; then
            echo "::error::BACKOFFICE_ADMIN_PASSWORD must be at least 12 characters"; exit 1
          fi
          if ! [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]; then echo "::error::Invalid VPS_HOST"; exit 1; fi
          if ! [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then echo "::error::Invalid VPS_USER"; exit 1; fi
          if ! [[ "$INPUT_DOMAIN" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]; then
            echo "::error::Invalid domain (lowercase host name expected, e.g. admin.example.com)"; exit 1
          fi
          # "~/x" means x relative to the SSH user's home (where ssh commands start).
          deploy_path=${INPUT_PATH#\~/}
          if ! [[ "$deploy_path" =~ ^/?[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "$deploy_path" == *..* ]]; then
            echo "::error::Invalid path (letters, digits, . _ - and / only, e.g. ~/pixeljoy)"; exit 1
          fi
          if [ "$INPUT_ROTATE" != "true" ] && [ "$INPUT_ROTATE" != "false" ]; then
            echo "::error::Invalid rotate_password"; exit 1
          fi
          if [ "$INPUT_PROXY" != "nginx" ] && [ "$INPUT_PROXY" != "caddy" ]; then
            echo "::error::Invalid proxy (nginx or caddy)"; exit 1
          fi
          app_port=${INPUT_APP_PORT:-${VAR_APP_PORT:-8787}}
          if ! [[ "$app_port" =~ ^[1-9][0-9]{3,4}$ ]] || [ "$app_port" -lt 1024 ] || [ "$app_port" -gt 65535 ]; then
            echo "::error::Invalid app_port / APP_PORT (1024-65535)"; exit 1
          fi
          {
            echo "DEPLOY_PROXY=$INPUT_PROXY"
            echo "DEPLOY_APP_PORT=$app_port"
            echo "DEPLOY_DOMAIN=$INPUT_DOMAIN"
            echo "DEPLOY_PATH=$deploy_path"
            echo "DEPLOY_ROTATE=$INPUT_ROTATE"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      # Dependencies and build scripts run WITHOUT any secret in their environment.
      - name: Build the password hashing tool
        working-directory: backoffice
        run: |
          npm ci --no-audit --no-fund
          node scripts/build.mjs

      # Only this step receives the admin password: it runs nothing but the bundled hash script.
      - name: Hash the admin password (on the runner)
        working-directory: backoffice
        env:
          BACKOFFICE_ADMIN_PASSWORD: ${{ secrets.BACKOFFICE_ADMIN_PASSWORD }}
        run: |
          # The clear password only goes through a pipe: never written to disk, never printed.
          line=$(printf '%s' "$BACKOFFICE_ADMIN_PASSWORD" | node dist/hash-password.mjs)
          hash=${line#ADMIN_PASSWORD_HASH=}
          if ! [[ "$hash" =~ ^scrypt:[0-9]+:[0-9]+:[0-9]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Could not hash BACKOFFICE_ADMIN_PASSWORD"; exit 1
          fi
          echo "::add-mask::$hash"
          umask 077
          printf '%s\n' "$hash" > "$RUNNER_TEMP/admin-hash"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          ssh vps true || { echo "::error::SSH connection failed (check VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_KNOWN_HOSTS)"; exit 1; }

      - name: Upload the release archive
        id: upload
        run: |
          backoffice/scripts/build-deploy-archive.sh "$RUNNER_TEMP/release.tar.gz" "$GITHUB_SHA"
          # DEPLOY_PATH and GITHUB_SHA were validated (no quote or shell metacharacter), so they can
          # be expanded here, on the runner, into the remote command.
          # shellcheck disable=SC2029
          ssh vps "set -eu; mkdir -p '$DEPLOY_PATH/releases'; cd '$DEPLOY_PATH/releases';
            rm -rf '$GITHUB_SHA.partial'; mkdir '$GITHUB_SHA.partial';
            tar -xzf - -C '$GITHUB_SHA.partial';
            rm -rf '$GITHUB_SHA'; mv '$GITHUB_SHA.partial' '$GITHUB_SHA'" < "$RUNNER_TEMP/release.tar.gz"

      - name: Preflight, configure, build and start on the VPS
        run: |
          # shellcheck disable=SC2029
          ssh vps bash "'$DEPLOY_PATH/releases/$GITHUB_SHA/backoffice/scripts/deploy-remote.sh'" \
            activate "'$DEPLOY_PATH'" "$GITHUB_SHA" "$DEPLOY_DOMAIN" "$DEPLOY_ROTATE" "$DEPLOY_PROXY" "$DEPLOY_APP_PORT" \
            < "$RUNNER_TEMP/admin-hash"

      # nginx mode: the deployment succeeds when the app answers on 127.0.0.1:<app_port> ON THE VPS.
      - name: Smoke test (local, on the VPS)
        if: env.DEPLOY_PROXY == 'nginx'
        run: |
          deadline=$((SECONDS + 120))
          while :; do
            # shellcheck disable=SC2029
            if body=$(ssh vps bash "'$DEPLOY_PATH/releases/$GITHUB_SHA/backoffice/scripts/deploy-remote.sh'" \
              local-check "'$DEPLOY_PATH'" "$DEPLOY_APP_PORT" 2>/dev/null) &&
              printf '%s' "$body" | jq -e '.v == 1' >/dev/null 2>&1; then
              echo "OK: http://127.0.0.1:$DEPLOY_APP_PORT/catalog/v1/manifest.json on the VPS (v=1)"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Local smoke test failed: no valid manifest on 127.0.0.1:$DEPLOY_APP_PORT on the VPS after 2 minutes"
              exit 1
            fi
            echo "waiting for http://127.0.0.1:$DEPLOY_APP_PORT on the VPS..."
            sleep 5
          done

      # nginx mode: informative only (Nginx and its certificate are configured by root, maybe later).
      - name: Public HTTPS check (non-blocking)
        if: env.DEPLOY_PROXY == 'nginx'
        run: |
          for attempt in 1 2 3; do
            manifest_ok=false
            if body=$(curl -fsS --max-time 10 "https://$DEPLOY_DOMAIN/catalog/v1/manifest.json" 2>/dev/null) &&
              printf '%s' "$body" | jq -e '.v == 1' >/dev/null 2>&1; then
              manifest_ok=true
            fi
            admin_code=$(curl -sS -L --max-time 10 -o /dev/null -w '%{http_code}' "https://$DEPLOY_DOMAIN/admin" 2>/dev/null) || admin_code=000
            if [ "$manifest_ok" = true ] && [ "$admin_code" = 200 ]; then
              echo "OK: https://$DEPLOY_DOMAIN/catalog/v1/manifest.json (v=1) and https://$DEPLOY_DOMAIN/admin (200)"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::warning::https://$DEPLOY_DOMAIN is not reachable yet (manifest ok: $manifest_ok, /admin: HTTP $admin_code). The app runs on 127.0.0.1:$DEPLOY_APP_PORT on the VPS: configure Nginx and the certificate as root (backoffice/README.md, « Derrière un Nginx existant »)."

      - name: Smoke test (public HTTPS, Caddy)
        if: env.DEPLOY_PROXY == 'caddy'
        run: |
          deadline=$((SECONDS + 180))
          while :; do
            manifest_ok=false
            admin_code=000
            if body=$(curl -fsS --max-time 10 "https://$DEPLOY_DOMAIN/catalog/v1/manifest.json" 2>/dev/null) &&
              printf '%s' "$body" | jq -e '.v == 1' >/dev/null 2>&1; then
              manifest_ok=true
            fi
            # /admin redirects to /admin/ (login page).
            admin_code=$(curl -sS -L --max-time 10 -o /dev/null -w '%{http_code}' "https://$DEPLOY_DOMAIN/admin" 2>/dev/null) || admin_code=000
            if [ "$manifest_ok" = true ] && [ "$admin_code" = 200 ]; then
              echo "OK: https://$DEPLOY_DOMAIN/catalog/v1/manifest.json (v=1) and https://$DEPLOY_DOMAIN/admin (200)"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Smoke test failed after 3 minutes (manifest ok: $manifest_ok, /admin: HTTP $admin_code)"
              exit 1
            fi
            echo "waiting for https://$DEPLOY_DOMAIN (manifest ok: $manifest_ok, /admin: HTTP $admin_code)..."
            sleep 10
          done

      - name: Diagnostics (docker compose ps and last 100 log lines)
        if: failure() && steps.upload.outcome == 'success'
        run: |
          # shellcheck disable=SC2029
          ssh vps bash "'$DEPLOY_PATH/releases/$GITHUB_SHA/backoffice/scripts/deploy-remote.sh'" diagnose "'$DEPLOY_PATH'" "$DEPLOY_PROXY" "$DEPLOY_APP_PORT" || true

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config "$RUNNER_TEMP/admin-hash" "$RUNNER_TEMP/release.tar.gz"
