# nginx configuration of the Affiny back-office container (docker-compose.traefik.yml): static Vite
# build (SPA) mounted read-only in /srv/backoffice. Runs as non-root (uid 101) on port 8080 with a
# read-only root filesystem: pid and temporary files live in /tmp (tmpfs). TLS is done by Traefik.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No access log (no IP address or request written), no version banner.
    access_log off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Vite puts content-hashed files under /assets/: cached for a year. Everything else (index.html
    # first) is revalidated, so that a new deployment is picked up at once.
    map $uri $cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        default    "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /srv/backoffice;
        index index.html;

        # Set here only (no add_header in the locations, which would drop these).
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Never serve hidden files or folders (.env, .git/, .htpasswd...) that a sync could drop here.
        location ~ /\. {
            return 404;
        }

        # Hashed assets: a missing file is a 404, never index.html.
        location /assets/ {
            try_files $uri =404;
        }

        # Container healthcheck only.
        location = /nginx-health {
            allow 127.0.0.1;
            deny all;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SPA: unknown paths are handled by the client-side router.
        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
}
